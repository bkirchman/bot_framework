[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot_framework"
version = "0.1.0"
description = "Game-agnostic bot framework core"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
hardware = [
    "opencv-python>=4.8",
    "cv2_enumerate_cameras; sys_platform == 'win32'",
]
ml = [
    "ultralytics>=8.3",
    "yolov5",
    "pandas",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.pytest.ini_options]
testpaths = ["framework/tests"]